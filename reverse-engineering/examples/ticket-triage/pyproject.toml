[project]
name = "ticket-triage"
version = "0.4.2"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "pydantic==2.7.1",
  "sqlalchemy==2.0.30",
  "httpx==0.27.0",
  "redis==5.0.4",
  "boto3==1.34.100",
]

[project.optional-dependencies]
dev = ["pytest==8.2.0", "pytest-asyncio==0.23.6", "ruff==0.4.4"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
